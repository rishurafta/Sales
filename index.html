<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Chourasiya Tyre Sales CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#0b0e1a; --bg2:#121629; --card:#161b30; --card2:#1c2239;
  --text:#e9edfa; --muted:#8d95b5; --border:#262d4a;
  --primary:#6366f1; --primary-d:#4f46e5; --accent:#22d3ee; --purple:#a855f7;
  --ok:#22c55e; --warn:#f59e0b; --danger:#ef4444;
  --radius:16px; --shadow:0 12px 34px rgba(0,0,0,.42);
}
html[data-theme="light"]{
  --bg:#eef1f8; --bg2:#ffffff; --card:#ffffff; --card2:#f4f7ff;
  --text:#111827; --muted:#5b6480; --border:#e3e9f5;
  --shadow:0 12px 30px rgba(17,24,39,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:
    radial-gradient(900px 500px at 100% -10%, rgba(99,102,241,.20), transparent 60%),
    radial-gradient(800px 500px at -10% 110%, rgba(34,211,238,.16), transparent 60%),
    var(--bg);
  color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
.app{display:none;min-height:100vh}
.app.show{display:flex}
.sidebar{
  width:252px;flex:0 0 252px;position:sticky;top:0;height:100vh;overflow:auto;
  background:linear-gradient(180deg,var(--bg2),transparent 70%);
  border-right:1px solid var(--border);padding:18px 14px;display:flex;flex-direction:column;gap:8px;z-index:60;
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px}
.brand .logo{
  width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;
  background:linear-gradient(135deg,var(--primary),var(--purple));box-shadow:0 8px 22px rgba(99,102,241,.45);
}
.brand h1{font-size:16px;font-weight:800;letter-spacing:.2px}
.brand p{font-size:10.5px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;padding:11px 13px;border-radius:12px;border:1px solid transparent;
  background:transparent;color:var(--muted);font:600 13.5px 'Inter';cursor:pointer;transition:.18s;text-align:left;
}
.nav-item:hover{background:var(--card);color:var(--text);transform:translateX(2px)}
.nav-item.active{
  background:linear-gradient(135deg,rgba(99,102,241,.24),rgba(168,85,247,.16));
  color:var(--text);border-color:rgba(99,102,241,.42);box-shadow:inset 0 0 0 1px rgba(99,102,241,.1);
}
.nav-ico{font-size:16px;width:20px;text-align:center}
.side-foot{margin-top:auto;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--border);font-size:11.5px;color:var(--muted);line-height:1.6}
.side-foot b{color:var(--text);font-size:12.5px}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;
  padding:13px 22px;border-bottom:1px solid var(--border);
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);
}
#menuBtn{display:none}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:9px}
.icon-btn{
  width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--card);
  color:var(--text);cursor:pointer;font-size:15px;display:grid;place-items:center;position:relative;transition:.18s;
}
.icon-btn:hover{background:var(--card2);transform:translateY(-1px)}
.badge-dot{
  position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);
  color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg);
}
.user-chip{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 5px;border-radius:40px;background:var(--card);border:1px solid var(--border);cursor:pointer}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--primary),var(--purple))}
#pages{padding:22px;flex:1}
.page{display:none;animation:fade .28s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-head{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.page-head h1{font-size:24px;font-weight:800;letter-spacing:-.4px}
.page-head p{font-size:12.5px;margin-top:4px}
.muted{color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.card{
  background:linear-gradient(180deg,var(--card),var(--card2));
  border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);
}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}
.card-head h3{font-size:14px;font-weight:700;letter-spacing:.1px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;margin-bottom:16px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
input,select,textarea{
  background:var(--bg2);border:1px solid var(--border);color:var(--text);
  padding:9px 12px;border-radius:10px;font:500 13px 'Inter';outline:none;transition:.15s;width:100%;
}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.18)}
textarea{resize:vertical;min-height:70px}
label.fld{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.55px;margin-bottom:6px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 15px;border-radius:10px;border:1px solid var(--border);background:var(--card2);
  color:var(--text);font:700 12.5px 'Inter';cursor:pointer;transition:.18s;white-space:nowrap;
}
.btn:hover{transform:translateY(-1px);border-color:var(--primary)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--purple));border-color:transparent;color:#fff;box-shadow:0 8px 20px rgba(99,102,241,.35)}
.btn.ok{background:linear-gradient(135deg,#16a34a,#22c55e);border-color:transparent;color:#fff}
.btn.danger{background:linear-gradient(135deg,#dc2626,#ef4444);border-color:transparent;color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:11.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:14px;margin-bottom:18px}
.stat{
  position:relative;overflow:hidden;padding:16px;border-radius:16px;cursor:pointer;
  background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--border);transition:.2s;
}
.stat:hover{transform:translateY(-3px);border-color:var(--primary)}
.stat::after{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:var(--c,var(--primary))}
.stat .ico{font-size:19px;margin-bottom:9px}
.stat .num{font-size:27px;font-weight:800;letter-spacing:-1px;line-height:1}
.stat .lbl{font-size:11.5px;color:var(--muted);margin-top:6px;font-weight:600;letter-spacing:.2px}

/* === TABLE CSS FOR STICKY ACTIONS === */
.tbl-wrap{overflow:auto;border-radius:12px;border:1px solid var(--border);max-height:calc(100vh - 250px)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:640px}
thead th{
  position:sticky;top:0;z-index:10;background:var(--bg2);text-align:left;padding:11px 12px;
  font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:800;
  border-bottom:1px solid var(--border);white-space:nowrap;
}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--bg)}

/* Sticky Columns for Pinning */
th:nth-child(1), td:nth-child(1) { position:sticky; left:0; z-index:5; background:var(--bg2); border-right:1px solid var(--border); width:40px; }
th:nth-child(2), td:nth-child(2) { position:sticky; left:40px; z-index:5; background:var(--bg2); border-right:1px solid var(--border); }
th.action-col, td.action-col { position:sticky; right:0; z-index:5; background:var(--bg2); border-left:1px solid var(--border); box-shadow:-4px 0 10px rgba(0,0,0,0.1); }

thead th:nth-child(1), thead th:nth-child(2), thead th.action-col { z-index: 11; }

tbody tr:hover td { background: rgba(99,102,241,.09) !important; }

.empty{padding:34px;text-align:center;color:var(--muted);font-size:13px}
.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:800;letter-spacing:.2px}
.tag.Hot{background:rgba(239,68,68,.17);color:#f87171}
.tag.Warm{background:rgba(245,158,11,.17);color:#fbbf24}
.tag.Cold{background:rgba(34,211,238,.17);color:#22d3ee}
.tag.Junk{background:rgba(120,120,140,.22);color:#a1a8c4}
.tag.Purchased{background:rgba(34,197,94,.17);color:#4ade80}
.tag.default{background:rgba(99,102,241,.17);color:#a5b4fc}
.bar-row{display:flex;align-items:center;gap:11px;margin-bottom:9px;font-size:12.5px}
.bar-row .name{flex:0 0 128px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bar-track{flex:1;height:8px;border-radius:8px;background:var(--bg2);overflow:hidden}
.bar-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--primary),var(--purple));transition:width .5s}
.bar-row .val{flex:0 0 62px;text-align:right;font-weight:800;font-size:12px}
.modal-back{position:fixed;inset:0;background:rgba(4,6,16,.72);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:200}
.modal{background:var(--card);border:1px solid var(--border);border-radius:20px;width:100%;max-width:720px;max-height:90vh;overflow:auto;box-shadow:0 30px 70px rgba(0,0,0,.6);animation:pop .22s ease}
.modal.wide{max-width:960px}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:3}
.modal-head h3{font-size:15px;font-weight:800}
.modal-body{padding:18px}

/* === NEW FORM CSS === */
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
.form-grid .full{grid-column:1/-1;}
.form-group{display:flex;flex-direction:column;gap:6px;}
.form-group label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.55px;}
.form-group input, .form-group select, .form-group textarea {
  padding:11px 14px;
  font-size:13.5px;
  border-radius:12px;
  background:var(--bg2);
  border:1px solid var(--border);
  color:var(--text);
  width:100%;
  transition:0.2s;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(99,102,241,.18);
}
.form-group textarea { resize:vertical; min-height:80px; }

/* === NEW STICKY MODAL HEADER === */
.modal-head {
  position: sticky; top: 0; background: var(--card); z-index: 10;
}

/* === RESPONSIVE === */
@media(max-width:768px){
  .form-grid { grid-template-columns: 1fr; }
}

.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.prod-pick{border:2px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;position:relative;background:var(--bg2);transition:.18s}
.prod-pick:hover{transform:translateY(-2px)}
.prod-pick.sel{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.28)}
.prod-pick img{width:100%;height:105px;object-fit:cover;display:block}
.prod-pick .pi{padding:8px}
.prod-pick .pn{font-size:12px;font-weight:800;margin-bottom:2px}
.prod-pick .pp{font-size:11px;color:var(--accent);font-weight:700}
.prod-pick .chk{position:absolute;top:7px;right:7px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;font-size:12px;border:2px solid #fff}
.prod-pick.sel .chk{background:var(--primary)}
.drop{
  border:2px dashed var(--border);border-radius:16px;padding:34px 18px;text-align:center;cursor:pointer;transition:.2s;
  background:linear-gradient(180deg,transparent,rgba(99,102,241,.06));
}
.drop:hover{border-color:var(--primary);background:rgba(99,102,241,.09)}
.drop .big{font-size:36px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:20px;background:var(--card2);border:1px solid var(--border);font-size:12px;font-weight:600;margin:0 6px 8px 0}
.chip button{background:none;border:0;color:var(--danger);cursor:pointer;font-size:13px;line-height:1}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hr{height:1px;background:var(--border);margin:14px 0}
.switch{position:relative;display:inline-block;width:44px;height:24px;flex:0 0 44px}
.switch input{display:none}
.slider{position:absolute;inset:0;background:var(--border);border-radius:24px;cursor:pointer;transition:.2s}
.slider:before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + .slider{background:var(--primary)}
.switch input:checked + .slider:before{transform:translateX(20px)}
#loginScreen{
  position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;
  background:var(--bg);padding:20px;
}
.login-card{
  width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);
  border-radius:24px;padding:32px;box-shadow:0 30px 80px rgba(0,0,0,.6);text-align:center;
}
.login-card .logo{
  width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:32px;margin:0 auto 20px;
  background:linear-gradient(135deg,var(--primary),var(--purple));box-shadow:0 8px 22px rgba(99,102,241,.45);
}
.login-card h2{font-size:22px;font-weight:800;margin-bottom:6px}
.login-card p{font-size:13px;color:var(--muted);margin-bottom:24px}
.login-card .fld{text-align:left}
#toast{position:fixed;bottom:22px;right:22px;z-index:600;display:flex;flex-direction:column;gap:9px}
.toast{
  padding:12px 17px;border-radius:12px;font-size:12.5px;font-weight:700;color:#fff;
  box-shadow:0 12px 30px rgba(0,0,0,.4);animation:slideIn .25s ease;max-width:330px;
}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.toast.ok{background:linear-gradient(135deg,#16a34a,#22c55e)}
.toast.err{background:linear-gradient(135deg,#dc2626,#ef4444)}
.toast.info{background:linear-gradient(135deg,#4f46e5,#8b5cf6)}
@media(max-width:980px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:.25s;box-shadow:0 0 60px rgba(0,0,0,.6)}
  .sidebar.open{transform:none}
  #menuBtn{display:grid}
  #pages{padding:15px}
  .topbar{padding:11px 14px}
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="logo">🛞</div>
    <h2>Welcome to Chourasiya Tyres Sales CRM</h2>
    <p>Please sign in to your account</p>
    <div style="margin-bottom:14px">
      <label class="fld">Email / User ID</label>
      <input id="loginId" placeholder="Enter your email" style="margin-bottom:4px">
    </div>
    <div style="margin-bottom:20px">
      <label class="fld">Password</label>
      <input id="loginPass" type="password" placeholder="Enter password">
    </div>
    <button class="btn primary" style="width:100%;padding:12px" onclick="doLogin()">Sign In →</button>
    <div style="margin-top:16px; font-size:11px; color:var(--muted)">
      <a href="#" onclick="clearLocalAndReload()" style="color:var(--primary)">Clear Cache & Sync Fresh Data</a>
    </div>
  </div>
</div>

<div class="app" id="mainApp">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">🛞</div>
      <div><h1>Chourasiya Tyres</h1><p>Sales</p></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <b id="sideUserName">User</b><br>
      <span id="sideUserRole">Role</span>
    </div>
  </aside>
  <main>
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div class="user-chip" onclick="confirmLogout()" title="Click to Logout">
        <div class="avatar" id="avatar">U</div>
        <div style="font-size:12px;font-weight:700;padding-right:5px" id="topUserName">User</div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Theme">🌙</button>
        <button class="icon-btn" onclick="openNotifications()" title="Notifications">🔔<span class="badge-dot" id="bellCount" style="display:none">0</span></button>
      </div>
    </header>
    <div id="pages">
      <section id="page-dashboard" class="page"></section>
      <section id="page-uploads" class="page"></section>
      <section id="page-reports" class="page"></section>
      <section id="page-leads" class="page"></section>
      <section id="page-products" class="page"></section>
      <section id="page-settings" class="page"></section>
    </div>
  </main>
</div>
<div id="modalRoot"></div>
<div id="toast"></div>

<script>
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p+'_'+Math.random().toString(36).slice(2,9);
const pad = n => String(n).padStart(2,'0');
const fmtDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => fmtDate(new Date());
const money = n => '₹'+Number(n||0).toLocaleString('en-IN');
function addDays(ds,n){ const d=new Date(ds+'T00:00:00'); d.setDate(d.getDate()+n); return fmtDate(d); }
function prettyDate(s){ if(!s) return '—'; const p=String(s).split('-'); return p.length===3?`${p[2]}-${p[1]}-${p[0]}`:s; }

// ⚠️ YAHAN APNA CLOUDFLARE WORKER URL DAALEIN
const API_URL = "https://chourasiyatyre.rishurafta.workers.dev";

const BASE_FIELDS=[
  {key:'leadSource',  label:'Lead Source',   type:'text'},
  {key:'entryDate',   label:'Entry Date',    type:'date'},
  {key:'mobile',      label:'Mobile Number', type:'text'},
  {key:'name',        label:'Name',          type:'text'},
  {key:'city',        label:'City',          type:'text'},
  {key:'state',       label:'State',         type:'text'},
  {key:'shopName',    label:'Shop Name',     type:'text'},
  {key:'orderAmount', label:'Order Amount',  type:'number'},
  {key:'orderQty',    label:'Order Qty',     type:'number'},
  {key:'tagging',     label:'Tagging',       type:'select'},
  {key:'followUpDate',label:'Follow Up Date',type:'date'},
  {key:'visitDate',   label:'Visit Date',    type:'date'},
  {key:'remarks',     label:'Remarks',       type:'textarea'}
];
const DEFAULT_TAGS=['Hot','Warm','Cold','Junk','Purchased','Follow Up','Visited','Quotation Sent'];
const DEFAULT_COLUMNS=JSON.parse(JSON.stringify(BASE_FIELDS));
const DEFAULT_PERMS={dashboard:1,leads:1,uploads:1,reports:1,products:1,settings:1};
const PAGES=['dashboard','leads','uploads','reports','products','settings'];
const PAGE_META={
  dashboard:{icon:'📊',label:'Dashboard'},
  leads:{icon:'👥',label:'Leads'},
  uploads:{icon:'📤',label:'Uploads'},
  reports:{icon:'📈',label:'Reports'},
  products:{icon:'🛞',label:'Products'},
  settings:{icon:'⚙️',label:'Settings'}
};

function ph(label,c1,c2){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
  <rect width="600" height="420" fill="url(#g)"/>
  <circle cx="300" cy="200" r="125" fill="#0d0f18" opacity=".92"/>
  <circle cx="300" cy="200" r="78" fill="#242a40"/>
  <circle cx="300" cy="200" r="34" fill="#7c8399"/>
  <circle cx="300" cy="200" r="14" fill="#c9cee0"/>

function ensurePerms(){

  DB.users.forEach(u=>{
    if(!u.perms || typeof u.perms!=='object'){ u.perms={...DEFAULT_PERMS}; dirty=true; }

    });

// FORCE CLOUD LOAD ON BOOT
async function fetchLeads() {
  try {
    const res = await fetch(`${API_URL}/api/leads`);
    if(res.ok) {
      const data = await res.json();
      
      DB.leads = (data.leads || []).map(l => {
        // 🔥 Custom Data (naye columns) ko wapas se lead ke andar daalein
        let parsed = l;
        try {
          if (l.customData && l.customData !== '{}') {
            const custom = JSON.parse(l.customData);
            parsed = { ...l, ...custom }; 
          }
        } catch(e) { console.error("Custom data parse error", e); }

        return {
          ...parsed,
          orderAmount: Number(parsed.orderAmount),
          orderQty: Number(parsed.orderQty)
        };
      });

      if(data.settings) DB.settings = { ...DB.settings, ...data.settings };
      if(data.users && data.users.length > 0) DB.users = data.users;
      
      if(data.columns && data.columns.length > 0) DB.columns = data.columns;
      else DB.columns = JSON.parse(JSON.stringify(DEFAULT_COLUMNS));
      
      if(!DB.tags || DB.tags.length === 0) DB.tags = DEFAULT_TAGS.slice();

      console.log('✅ Leads fetched:', DB.leads.length, '| Users:', DB.users.length);
    }
  } catch(e) { console.error('❌ Failed to load data', e); }
}

async function fetchUsers() {
  try {
    const res = await fetch(`${API_URL}/api/users`);
    if (res.ok) {
      const data = await res.json();
      if (data.users && data.users.length > 0) {
        DB.users = data.users;
        console.log('✅ Users loaded from cloud:', DB.users.length);
      } else {

    } else {

    }
  } catch (e) {
    console.error('❌ fetchUsers failed:', e);
  }
}

async function boot() {
  // 1. Cloud se fresh data load karein
  await fetchLeads();

  // 2. Permissions aur Theme apply karein
  ensurePerms();

  if(window.location.search.includes('logout=true')) {

  }

  // 4. Check karein ki koi logged in hai ya nahi
  if (DB.settings.currentUserId && DB.users.some(u=>u.id===DB.settings.currentUserId)) {
    $('#loginScreen').style.display = 'none';

}

function doLogin(){
  const id = $('#loginId').value.trim().toLowerCase();
  const pass = $('#loginPass').value;
  
  // 🔥 Null-safe check — agar email ya name khali ho toh crash nahi hoga
  const user = DB.users.find(u =>
    ((u.email || '').toLowerCase() === id || (u.name || '').toLowerCase() === id) &&
    u.password === pass
  );

function periodRange(period,from,to){
  const t=new Date(); const td=fmtDate(t);
  if(period==='yesterday'){ const y=addDays(td,-1); return {from:y,to:y}; }
  if(period==='weekly')   { return {from:addDays(td,-6),to:td}; }
  if(period==='monthly')  { return {from:fmtDate(new Date(t.getFullYear(),t.getMonth(),1)),to:td}; }
  if(period==='custom')   { return {from:from||'0000-01-01', to:to||'9999-12-31'}; }
  return {from:'0000-01-01',to:'9999-12-31'};
}

function filterLeads({from,to,user}={}){
  return DB.leads.filter(l=>{
    const ed=l.entryDate||today();
    if(from && ed<from) return false;
    if(to && ed>to) return false;
    if(user && user!=='all' && l.assignedTo!==user) return false;
    return true;
  });
}
const isClosed = l => l.tagging==='Junk' || l.tagging==='Purchased';

    return `<div class="row-between" style="padding:9px 0;border-bottom:1px solid var(--border)">

function parseSheetData(text,isBinary,fileName){
  let aoa=[];
  if(window.XLSX){
    const wb = isBinary ? XLSX.read(new Uint8Array(text),{type:'array'}) : XLSX.read(text,{type:'string'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  } else {
    aoa=text.split(/\r?\n/).filter(Boolean).map(line=>{
      const out=[];let cur='',q=false;
      for(let i=0;i<line.length;i++){ const c=line[i]; if(c==='"'){ if(q&&line[i+1]==='"'){cur+='"';i++;} else q=!q; } else if(c===','&&!q){ out.push(cur); cur=''; } else cur+=c; }
      out.push(cur); return out;
    });
  }
  aoa=aoa.filter(r=>r.some(c=>String(c).trim()!==''));
  if(aoa.length<2) throw new Error('File has no data rows');
  return {headers:aoa[0].map((h,i)=>String(h).trim()||('Column '+(i+1))),rows:aoa.slice(1),fileName:fileName||'Imported file'};
}

function handleFile(file){
  const reader=new FileReader(); const isCsv=/\.csv$/i.test(file.name);
  reader.onload=e=>{
    try{
      const parsed=parseSheetData(e.target.result,!isCsv,file.name);
      UI.upload=parsed; UI.upload.map=autoMap(parsed.headers); UI.upload.source='file';
      renderMapping(); toast('File parsed: '+parsed.rows.length+' rows','ok');
    }catch(err){ toast('Parse error: '+err.message,'err'); }
  };
  if(isCsv) reader.readAsText(file); else reader.readAsArrayBuffer(file);
}

function autoMap(headers){
  const map={};
  DB.columns.forEach(f=>{
    const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
    const target=norm(f.label);
    const hit=headers.find(h=>{ const n=norm(h); return n===target || n.includes(target) || (target.includes(n) && n.length>3); });
    map[f.key]=hit||'';
  });
  return map;
}

function rowToLead(row,u){
  const get=k=>{ const col=u.map[k]; if(!col) return ''; const idx=u.headers.indexOf(col); return idx>=0 ? String(row[idx]??'').trim() : ''; };
  const toDate=v=>{
    if(!v) return '';
    if(/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0,10);
    const m=v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
    if(m){ let y=m[3]; if(y.length===2) y='20'+y; return `${y}-${pad(m[2])}-${pad(m[1])}`; }
    const d=new Date(v); return isNaN(d)?'':fmtDate(d);
  };
  
  const lead = {
    id:uid('ld'), createdAt:Date.now(), remarksHistory:[], customData:{}
  };
  
  // Base fields (jo database table mein hain)
  const baseKeys = ['id','leadSource','entryDate','mobile','name','city','state','shopName','orderAmount','orderQty','tagging','followUpDate','visitDate','remarks','remarksHistory','assignedTo','createdAt','customData'];

  DB.columns.forEach(c => {
    let val = get(c.key);
    
    if(c.type === 'date') val = toDate(val) || (c.key==='entryDate'? today() : '');
    else if(c.type === 'number') val = Number(String(val).replace(/[^\d.]/g,'')) || 0;
    
    // 🔥 Agar naya column hai, toh customData ke andar daalo
    if (!baseKeys.includes(c.key)) {
      lead.customData[c.key] = val;
    } else {
      lead[c.key] = val;
    }
  });
  
  if(!lead.entryDate) lead.entryDate = today();
  if(!lead.tagging) lead.tagging = 'Hot';
  if(!lead.assignedTo) lead.assignedTo = DB.settings.currentUserId;
  
  if (lead.remarks && lead.remarks.trim() !== '') {
    lead.remarksHistory.push({
      text: lead.remarks,
      date: new Date().toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' })
    });
  }

  return lead;
}
async function importMapped(silent){
  const u=UI.upload; if(!u) return;
  if(!u.map.name && !u.map.mobile){ toast('Map at least Name or Mobile column','err'); return; }
  
  const btn = document.querySelector('#mapArea .btn.primary');
  if(btn){ btn.disabled = true; btn.textContent = "Preparing..."; }

  let added=0, skipped=0, updated=0;
  let newLeads = [];
  
  u.rows.forEach(r=>{
    const lead = rowToLead(r,u);
    if(!lead.name && !lead.mobile){ skipped++; return; }
    
    // 🔥 Purani lead dhundo mobile number se
    const existIdx = DB.leads.findIndex(x => x.mobile && x.mobile === lead.mobile);
    
    if(existIdx > -1) {
      // Agar pehle se hai, toh ID same rakho aur naya data daalo
      lead.id = DB.leads[existIdx].id; 
      DB.leads[existIdx] = lead;
      updated++;
    } else {
      // Nayi lead hai
      DB.leads.push(lead);
      added++;
    }
    
    newLeads.push(lead); 
  });
  
  if(newLeads.length > 0) {
    if(btn) btn.textContent = `Uploading ${newLeads.length} leads...`;
    try {
      const res = await fetch(`${API_URL}/api/leads/sync`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newLeads) 
      });
      if(!res.ok) {
        const errData = await res.json();
        throw new Error(errData.error || `Server error: ${res.status}`);
      }
    } catch(err) {
      console.error('Upload failed:', err);
      toast('Upload failed: ' + err.message, 'err');
      if(btn) { btn.disabled = false; btn.textContent = "Retry Import"; }
      return;
    }
  }
  
  updateTopbar();
  if(!silent){ toast(`Success! Added: ${added}, Updated: ${updated}, Skipped: ${skipped}`,'ok'); }
  UI.upload=null; const area=$('#mapArea'); if(area) area.innerHTML='';
  if(UI.page==='uploads') RENDER.uploads(); else if(UI.page==='leads') RENDER.leads();
}
  
async function fetchSheet(silent=false){
  const urlInput = ($('#gsUrl')||{}).value || DB.settings.sheetUrl;
  const nameInput = ($('#gsName')||{}).value || DB.settings.sheetName;
  if(!urlInput){ toast('Please paste a Google Sheet URL','err'); return; }
  const info = extractSheetInfo(urlInput);
  if(!info){ toast('Invalid Google Sheet URL format','err'); return; }
  DB.settings.sheetUrl = urlInput; DB.settings.sheetName = nameInput || ''; saveLocal();
  let csvUrl = `https://docs.google.com/spreadsheets/d/${info.sheetId}/export?format=csv`;
  if (info.gid) csvUrl += `&gid=${info.gid}`;
  else if (nameInput) csvUrl += `&sheet=${encodeURIComponent(nameInput)}`;
  const proxies = [
    `https://api.allorigins.win/raw?url=${encodeURIComponent(csvUrl)}`,
    `https://corsproxy.io/?${encodeURIComponent(csvUrl)}`,
    `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(csvUrl)}`
  ];
  try{
    if(!silent) toast('Fetching sheet data...','info');
    let text = null;
    for (let proxy of proxies) {
      try {
        const res = await fetch(proxy, { cache: 'no-store' });
        if (res.ok) {
          const tempText = await res.text();
          if (!tempText.trim().startsWith('<')) { text = tempText; break; }
        }
      } catch(e) { console.warn('Proxy failed, trying next...', e); }
    }
    if (!text) throw new Error('Could not reach Google Sheets. Ensure sharing is set to "Anyone with the link → Viewer".');
    const parsed = parseSheetData(text, false, 'Google Sheet');
    UI.upload = parsed; UI.upload.map = autoMap(parsed.headers); UI.upload.source = 'sheet';
    renderMapping(); DB.settings.lastSync = new Date().toLocaleString(); saveLocal();
    toast('Sheet connected — '+parsed.rows.length+' rows loaded','ok');
    if(silent) importMapped(true);
  } catch(err){ toast('Sheet fetch error: ' + err.message, 'err'); console.error(err); }
}
function startAutoSync(){ stopAutoSync(); autoSyncTimer=setInterval(()=>fetchSheet(true),60000); }
function stopAutoSync(){ if(autoSyncTimer){ clearInterval(autoSyncTimer); autoSyncTimer=null; } }

function downloadCSV(filename,rows){
  const csv=rows.map(r=>r.map(c=>{ const s=String(c??''); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }).join(',')).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}

}

async function bulkDeleteLeads() {
  const count = UI.selectedLeads.size;
  if (count === 0) return;
  if (!confirm(`Are you sure you want to permanently delete ${count} selected lead(s)?`)) return;
  
  const btn = document.querySelector('.btn.danger');
  if(btn) { btn.disabled = true; btn.textContent = "Deleting..."; }
  
  const idsToDelete = Array.from(UI.selectedLeads);
  
  try {
    await fetch(`${API_URL}/api/leads/delete`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(idsToDelete)
    });
    
    DB.leads = DB.leads.filter(l => !UI.selectedLeads.has(l.id));
    UI.selectedLeads.clear();
    
    updateTopbar();
    RENDER.leads();
    toast(`${count} leads deleted successfully`, 'ok');
  } catch(err) {
    toast('Delete failed. Check internet.', 'err');
    console.error(err);
  } finally {
    if(btn) { btn.disabled = false; btn.textContent = "🗑 Delete Selected"; }
  }
}

async function saveLead(id){
  const form=$('.modal-body'); const data={};
  $$('input,select,textarea',form).forEach(el=>{ if(el.name && !el.disabled) data[el.name]=el.value; });
  if(!data.assignedTo) data.assignedTo = DB.settings.currentUserId;
  data.orderAmount=Number(data.orderAmount)||0; data.orderQty=Number(data.orderQty)||0;
  if(!data.name && !data.mobile){ toast('Name or Mobile is required','err'); return; }
  if(!data.entryDate) data.entryDate=today();

  if(id){ 
    const idx=DB.leads.findIndex(x=>x.id===id); 
    if(idx>-1) {
      const oldLead = DB.leads[idx];
      
      let history = oldLead.remarksHistory || [];
      if (data.remarks && data.remarks.trim() !== '' && data.remarks !== oldLead.remarks) {
        history.push({
          text: data.remarks,
          date: new Date().toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' })
        });
      }
      
      DB.leads[idx]=Object.assign(DB.leads[idx],data, { remarksHistory: history }); 
      await fetch(`${API_URL}/api/leads/sync`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify([DB.leads[idx]])
      });
    }
    toast('Lead updated successfully','ok'); 
  }
  else { 
    const newLead = Object.assign({id:uid('ld'),createdAt:Date.now(),remarksHistory:[]},data);
    
    if (newLead.remarks && newLead.remarks.trim() !== '') {
      newLead.remarksHistory.push({
        text: newLead.remarks,
        date: new Date().toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' })
      });
    }
    
    DB.leads.push(newLead); 
    await fetch(`${API_URL}/api/leads/sync`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify([newLead])
    });
    toast('Lead added successfully','ok'); 
  }
  closeModal(); refresh();
}

function toPNG(src){
  return new Promise(res=>{
    const img=new Image(); img.crossOrigin='anonymous';
    img.onload=()=>{ try{ const scale=Math.min(1,900/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(img.width*scale)); c.height=Math.max(1,Math.round(img.height*scale)); const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height); res({data:c.toDataURL('image/png'),w:c.width,h:c.height}); }catch(e){ res(null); } };
    img.onerror=()=>res(null); img.src=src;
  });
}

async function doSend(){
  const {leadId,selected}=UI.msg; const lead=DB.leads.find(l=>l.id===leadId);
  const prods=DB.products.filter(p=>selected.has(p.id)); if(!prods.length){ toast('Select at least one product','err'); return; }
  const phone=($('#msgPhone').value||'').replace(/\D/g,''); UI.msg.phone=$('#msgPhone').value; const target=$('#msgTarget').value;
  toast('Generating PDF…','info');
  try{
    const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:'mm',format:'a4'}); const W=210;
    doc.setFillColor(99,102,241); doc.rect(0,0,W,30,'F'); doc.setTextColor(255,255,255); doc.setFontSize(19); doc.setFont(undefined,'bold'); doc.text('Product Quotation',14,14); doc.setFontSize(9.5); doc.setFont(undefined,'normal'); doc.text('TyroCRM • '+new Date().toLocaleString(),14,22);
    doc.setTextColor(30,35,55); doc.setFontSize(11); doc.setFont(undefined,'bold'); doc.text('To: '+(lead.name||'Customer'),14,42); doc.setFont(undefined,'normal'); doc.setFontSize(9.5); doc.setTextColor(80,90,110); doc.text((lead.shopName||'')+'  |  '+(lead.mobile||''),14,48); doc.text((lead.city||'')+(lead.state?', '+lead.state:''),14,54);
    let y=66;
    for(const p of prods){
      if(y>225){ doc.addPage(); y=20; }
      const img=await toPNG(p.image); if(img) doc.addImage(img.data,'PNG',14,y,44,33);
      doc.setTextColor(25,30,50); doc.setFontSize(12); doc.setFont(undefined,'bold'); doc.text(doc.splitTextToSize(p.name,W-70),60,y+8); doc.setFont(undefined,'normal'); doc.setFontSize(10); doc.setTextColor(99,102,241); doc.text('Price: '+p.priceRange,60,y+16); doc.setTextColor(90,95,115); doc.setFontSize(9); doc.text(doc.splitTextToSize(p.details||'',W-78),60,y+23); doc.setDrawColor(225,230,240); doc.line(14,y+37,W-14,y+37); y+=45;
    }
    doc.setFontSize(8.5); doc.setTextColor(140,145,165); doc.text('This is a computer-generated quotation. Prices subject to stock availability.',14,285);
    const fname='Quotation_'+String(lead.name||'Lead').replace(/\s+/g,'_')+'.pdf'; doc.save(fname);
    const names=prods.map(p=>`• ${p.name} — ${p.priceRange}`).join('\n'); const text=`Hello ${lead.name||''},\n\nPlease find our quotation attached.\n\n${names}\n\nRegards,\nTyroCRM Sales Team`;
    if(target==='whatsapp'){ if(!phone){ toast('PDF downloaded. Add a mobile number to open WhatsApp.','info'); closeModal(); return; } const p = phone.length===10 ? '91'+phone : phone; window.open(`https://wa.me/${p}?text=${encodeURIComponent(text)}`,'_blank'); }
    else { window.open(`https://t.me/share/url?url=${encodeURIComponent('https://tyrocrm.app')}&text=${encodeURIComponent(text)}`,'_blank'); }
    toast('PDF generated & chat opened ✔','ok'); closeModal();
  }catch(err){ console.error(err); toast('PDF error: '+err.message,'err'); }
}

      <label class="fld">Transfer Leads From</label><select id="tfFrom" style="margin-bottom:10px">${DB.users.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select>
      <label class="fld">Transfer Leads To</label><select id="tfTo" style="margin-bottom:12px">${DB.users.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select>
      <button class="btn primary" style="width:100%" onclick="transferLeads()">🔀 Transfer All Leads</button>
      <div class="hr"></div><button class="btn danger" style="width:100%" onclick="deleteJunk()">🗑 Delete All Junk Leads</button>
      <div class="hr"></div><button class="btn danger" style="width:100%" onclick="factoryReset()">⚠️ Reset Entire CRM (Factory)</button>
    </div>
    <div class="card"><div class="card-head"><h3>🎨 Appearance & Notifications</h3></div>
      <div class="row-between" style="margin-bottom:12px"><span style="font-size:12.5px;font-weight:600">Theme</span><select style="width:130px" onchange="DB.settings.theme=this.value;applyTheme();saveLocal()"><option value="dark" ${DB.settings.theme==='dark'?'selected':''}>Dark</option><option value="light" ${DB.settings.theme==='light'?'selected':''}>Light</option></select></div>
      <div class="row-between"><span style="font-size:12.5px;font-weight:600">Notifications (reminders & follow-ups)</span><label class="switch"><input type="checkbox" ${DB.settings.notifications?'checked':''} onchange="DB.settings.notifications=this.checked;saveLocal();toast('Notifications '+(this.checked?'ON':'OFF'),'ok')"><span class="slider"></span></label></div>
    </div>
    <div class="card"><div class="card-head"><h3>🔌 Integrations</h3></div>
      <label class="fld">WhatsApp Number (with country code)</label><input id="setWa" value="${esc(DB.settings.whatsapp||'')}" placeholder="919876543210" style="margin-bottom:10px">
      <label class="fld">Telegram Chat ID / Bot Token</label><input id="setTg" value="${esc(DB.settings.telegram||'')}" placeholder="123456789:AAH... or @channel" style="margin-bottom:12px">
      <button class="btn primary" style="width:100%" onclick="saveIntegrations()">💾 Save Integrations</button>
    </div>
    <div class="card"><div class="card-head"><h3>🔒 Password & Security</h3></div>
      <label class="fld">Current Password</label><input type="password" id="pwOld" placeholder="••••" style="margin-bottom:10px">
      <label class="fld">New Password</label><input type="password" id="pwNew" placeholder="••••" style="margin-bottom:12px">
      <button class="btn primary" style="width:100%" onclick="changePassword()">🔑 Update Password</button>
    </div>
    <div class="card"><div class="card-head"><h3>🗂️ Lead Table Columns</h3></div>
      <div id="colList" style="margin-bottom:12px"></div>
      <div style="display:flex;gap:8px"><input id="newColName" placeholder="New column name (e.g. GST Number)"><button class="btn primary" onclick="addColumn()">＋ Add</button></div>
    </div>
    <div class="card"><div class="card-head"><h3>🏷️ Tagging Options</h3></div>
      <div style="margin-bottom:12px">${DB.tags.map(t=>`<span class="chip">${esc(t)}<button onclick="removeTag('${esc(t)}')">✕</button></span>`).join('')}</div>
      <div style="display:flex;gap:8px"><input id="newTag" placeholder="New tagging name"><button class="btn primary" onclick="addTag()">＋ Add</button></div>
    </div>
  </div>`;
  renderUserList(); renderColList();
};

function renderUserList(){
  const box=$('#userList'); if(!box) return;
  box.innerHTML=DB.users.map(u=>`
    <div style="padding:11px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--bg2)">
      <div class="row-between" style="margin-bottom:9px">
        <div style="display:flex;gap:9px;align-items:center"><div class="avatar">${esc(u.name.charAt(0))}</div><div><div style="font-weight:800;font-size:12.5px">${esc(u.name)} ${u.id===DB.settings.currentUserId?'<span class="tag default" style="margin-left:4px">You</span>':''}</div><div class="muted" style="font-size:11px">${esc(u.email||'')} • ${esc(u.role)}</div></div></div>
        <div style="display:flex;gap:6px"><button class="btn sm" onclick="userModal('${u.id}')">✏️</button>${DB.users.length>1?`<button class="btn sm danger" onclick="deleteUser('${u.id}')">🗑</button>`:''}</div>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${PAGES.map(p=>`<label class="chip" style="cursor:pointer;margin:0;padding:5px 9px;font-size:11px"><input type="checkbox" ${u.perms&&u.perms[p]?'checked':''} ${u.role==='Admin'?'disabled':''} onchange="togglePerm('${u.id}','${p}',this.checked)" style="width:auto;margin:0">${PAGE_META[p].label}</label>`).join('')}</div>
    </div>`).join('');
}

function togglePerm(uid,perm,val){
  const u=DB.users.find(x=>x.id===uid); if(!u) return;
  if(u.role==='Admin'){ toast('Admin users always have all permissions','info'); renderUserList(); return; }
  u.perms=u.perms||{}; u.perms[perm]=val?1:0; 
  saveLocal();
  renderUserList(); toast('Permission updated','ok');
}

function userModal(id){
  const u = id ? DB.users.find(x=>x.id===id) : {id:null,name:'',email:'',password:'',role:'Sales'};
  openModal(`
    <div class="form-grid"><div><label class="fld">Full Name</label><input id="uName" value="${esc(u.name)}"></div><div><label class="fld">Email</label><input id="uEmail" value="${esc(u.email||'')}"></div><div><label class="fld">Role</label><select id="uRole"><option value="Sales" ${u.role==='Sales'?'selected':''}>Sales</option><option value="Admin" ${u.role==='Admin'?'selected':''}>Admin</option></select></div><div><label class="fld">Password</label><input id="uPass" type="text" value="${esc(u.password||'')}"></div></div>
    <div class="muted" style="font-size:11.5px;margin-top:10px">Admin role always has all permissions. Sales role uses the checkboxes in the user list.</div>
    <div class="hr"></div><div class="row-between"><span></span><div style="display:flex;gap:8px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveUser('${id||''}')">💾 Save User</button></div></div>
  `,{title: id?'✏️ Edit User':'＋ Add User'});
}

async function saveUser(id){
  const name=$('#uName').value.trim(); if(!name){ toast('Name is required','err'); return; }
  const data={name,email:$('#uEmail').value.trim(),role:$('#uRole').value,password:$('#uPass').value||'1234'};
  
  if(id){ 
    const u=DB.users.find(x=>x.id===id); 
    Object.assign(u,data); 
    if(u.role==='Admin'){ PAGES.forEach(p=>u.perms[p]=1); }
  } else { 
    const perms={}; 
    PAGES.forEach(p=>perms[p]= data.role==='Admin' ? 1 : (p==='settings'?0:1)); 
    const newUser = Object.assign({id:uid('u'),perms},data);
    DB.users.push(newUser); 
  }
  
  // 🔥 Save to Cloud Database — with proper error check
  try {
    const res = await fetch(`${API_URL}/api/sync-users`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ users: DB.users })
    });
    if(!res.ok){
      toast('Warning: Cloud sync failed (HTTP ' + res.status + ')', 'err');
      console.error('sync-users failed:', res.status, await res.text());
    }
  } catch(e) {
    toast('Warning: User saved locally but cloud sync failed', 'err');
    console.error('sync-users error:', e);
  }

  saveLocal();
  closeModal(); renderUserList(); updateTopbar(); renderNav(); toast('User saved','ok');
}

async function deleteUser(id){
  if(DB.users.length<=1){ toast('At least one user required','err'); return; }
  if(!confirm('Delete this user? Their leads will be reassigned to the first user.')) return;
  const fallback=DB.users.find(u=>u.id!==id).id;
  
  DB.leads.forEach(l=>{ if(l.assignedTo===id) l.assignedTo=fallback; });
  
  // 🔥 Delete from Cloud Database — with proper error check
  try {
    const res = await fetch(`${API_URL}/api/sync-users`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'delete', id: id })
    });
    if(!res.ok){
      toast('Warning: Cloud delete failed (HTTP ' + res.status + ')', 'err');
      console.error('delete user failed:', res.status, await res.text());
    }
  } catch(e) {
    toast('Warning: User deleted locally but cloud sync failed', 'err');
    console.error('delete user error:', e);
  }

  DB.users=DB.users.filter(u=>u.id!==id);
  if(DB.settings.currentUserId===id) DB.settings.currentUserId=fallback;
  
  saveLocal();
  renderUserList(); updateTopbar(); renderNav(); toast('User deleted','ok');
}

async function transferLeads(){
  const from=$('#tfFrom').value, to=$('#tfTo').value;
  if(from===to){ toast('Source and destination must differ','err'); return; }
  let n=0; 
  for(const l of DB.leads){
    if(l.assignedTo===from){ 
      l.assignedTo=to; 
      n++; 
      await fetch(`${API_URL}/api/leads/sync`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify([l])
      });
    } 
  }
  updateTopbar(); toast(`${n} leads transferred`,'ok'); RENDER[UI.page]&&RENDER[UI.page]();
}

async function deleteJunk(){
  const junkLeads = DB.leads.filter(l=>l.tagging==='Junk');
  const n = junkLeads.length;
  if(!n){ toast('No junk leads found','info'); return; }
  if(!confirm(`Delete ${n} junk leads permanently?`)) return;
  
  for(const l of junkLeads){
    await fetch(`${API_URL}/api/leads/delete`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: l.id })
    });
  }
  
  DB.leads=DB.leads.filter(l=>l.tagging!=='Junk'); 
  updateTopbar(); RENDER.settings(); toast(n+' junk leads deleted','ok');
}

async function factoryReset(){
  if(!confirm('This will erase ALL data and restore demo data. Continue?')) return;
  DB = loadLocal();
  DB.settings.currentUserId = null;
  DB.leads = [];
  saveLocal();
  $('#mainApp').classList.remove('show');
  $('#loginScreen').style.display = 'flex';
  $('#loginPass').value = '';
  toast('CRM reset to factory demo data. Please login.','ok');
}

function saveIntegrations(){ 
  DB.settings.whatsapp=$('#setWa').value.trim(); 
  DB.settings.telegram=$('#setTg').value.trim(); 
  saveLocal();
  toast('Integrations saved','ok'); 
}

function changePassword(){
  const u=currentUser(); const oldP=$('#pwOld').value, newP=$('#pwNew').value;
  if(oldP!==u.password){ toast('Current password is incorrect','err'); return; }
  if(!newP || newP.length<4){ toast('New password must be at least 4 characters','err'); return; }
  u.password=newP; 
  saveLocal();
  $('#pwOld').value=''; $('#pwNew').value=''; toast('Password updated successfully','ok');
}

function renderColList(){
  const box=$('#colList'); if(!box) return;
  box.innerHTML=DB.columns.map((c,i)=>`<div class="row-between" style="padding:8px 0;border-bottom:1px solid var(--border)"><div style="display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600"><input type="checkbox" style="width:auto" ${c.visible?'checked':''} onchange="DB.columns[${i}].visible=this.checked;saveLocal();renderColList()">${esc(c.label)}</div><div style="display:flex;gap:5px"><button class="btn sm" onclick="moveCol(${i},-1)" ${i===0?'disabled':''}>↑</button><button class="btn sm" onclick="moveCol(${i},1)" ${i===DB.columns.length-1?'disabled':''}>↓</button><button class="btn sm danger" onclick="removeColumn(${i})">✕</button></div></div>`).join('');
}
function moveCol(i,dir){ const j=i+dir; if(j<0||j>=DB.columns.length) return; [DB.columns[i],DB.columns[j]]=[DB.columns[j],DB.columns[i]]; saveLocal(); renderColList(); toast('Column moved','ok'); }
function removeColumn(i){
  const c=DB.columns[i];
  if(BASE_FIELDS.some(b=>b.key===c.key)){ if(!confirm(`"${c.label}" is a core field. Hide it instead of deleting?`)) return; DB.columns[i].visible=false; saveLocal(); renderColList(); return; }
  if(!confirm(`Delete column "${c.label}" and its data from all leads?`)) return;
  
  DB.leads.forEach(l=>{ delete l[c.key]; });
  DB.columns.splice(i,1); 
  saveLocal();
  renderColList(); toast('Column removed','ok');
}
function addColumn(){
  const name=$('#newColName').value.trim(); if(!name){ toast('Enter a column name','err'); return; }
  if(DB.columns.some(c=>c.label.toLowerCase()===name.toLowerCase())){ toast('Column already exists','err'); return; }
  DB.columns.push({key:'cf_'+uid(''),label:name,type:'text',visible:true}); 
  $('#newColName').value=''; 
  saveLocal();
  renderColList(); toast('Column added','ok');
}
function addTag(){
  const t=$('#newTag').value.trim(); if(!t){ toast('Enter a tagging name','err'); return; }
  if(DB.tags.includes(t)){ toast('Tagging already exists','err'); return; }
  DB.tags.push(t); 
  $('#newTag').value=''; 
  saveLocal();
  RENDER.settings(); toast('Tagging added','ok');
}
function removeTag(t){
  if(!confirm(`Remove tagging "${t}"? Leads with this tag will keep the value.`)) return;
  DB.tags=DB.tags.filter(x=>x!==t); 
  saveLocal();
  RENDER.settings(); toast('Tagging removed','ok');
}

boot();

window.addEventListener('keydown',e=>{ 
  if(e.key==='Escape') closeModal(); 
  if(e.key==='Enter' && $('#loginScreen')?.style.display !== 'none') doLogin();
});
</script>
<script>
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('cut', function (e) { e.preventDefault(); });
  document.addEventListener('copy', function (e) { e.preventDefault(); });
  document.addEventListener('paste', function (e) { e.preventDefault(); });
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey && (e.key === 'c' || e.key === 'C' || e.key === 'x' || e.key === 'X' || e.key === 'v' || e.key === 'V' || e.key === 'u' || e.key === 'U') || e.key === 'F12') {
      e.preventDefault();
    }
  });
</script>
