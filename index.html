<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Chourasiya Tyre Sales CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
/* [SAME CSS AS BEFORE] */
:root{
  --bg:#0b0e1a; --bg2:#121629; --card:#161b30; --card2:#1c2239;
  --text:#e9edfa; --muted:#8d95b5; --border:#262d4a;
  --primary:#6366f1; --primary-d:#4f46e5; --accent:#22d3ee; --purple:#a855f7;
  --ok:#22c55e; --warn:#f59e0b; --danger:#ef4444;
  --radius:16px; --shadow:0 12px 34px rgba(0,0,0,.42);
}
html[data-theme="light"]{
  --bg:#eef1f8; --bg2:#ffffff; --card:#ffffff; --card2:#f4f7ff;
  --text:#111827; --muted:#5b6480; --border:#e3e9f5;
  --shadow:0 12px 30px rgba(17,24,39,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:
    radial-gradient(900px 500px at 100% -10%, rgba(99,102,241,.20), transparent 60%),
    radial-gradient(800px 500px at -10% 110%, rgba(34,211,238,.16), transparent 60%),
    var(--bg);
  color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
.app{display:none;min-height:100vh}
.app.show{display:flex}
.sidebar{
  width:252px;flex:0 0 252px;position:sticky;top:0;height:100vh;overflow:auto;
  background:linear-gradient(180deg,var(--bg2),transparent 70%);
  border-right:1px solid var(--border);padding:18px 14px;display:flex;flex-direction:column;gap:8px;z-index:60;
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px}
.brand .logo{
  width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;
  background:linear-gradient(135deg,var(--primary),var(--purple));box-shadow:0 8px 22px rgba(99,102,241,.45);
}
.brand h1{font-size:16px;font-weight:800;letter-spacing:.2px}
.brand p{font-size:10.5px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;padding:11px 13px;border-radius:12px;border:1px solid transparent;
  background:transparent;color:var(--muted);font:600 13.5px 'Inter';cursor:pointer;transition:.18s;text-align:left;
}
.nav-item:hover{background:var(--card);color:var(--text);transform:translateX(2px)}
.nav-item.active{
  background:linear-gradient(135deg,rgba(99,102,241,.24),rgba(168,85,247,.16));
  color:var(--text);border-color:rgba(99,102,241,.42);box-shadow:inset 0 0 0 1px rgba(99,102,241,.1);
}
.nav-ico{font-size:16px;width:20px;text-align:center}
.side-foot{margin-top:auto;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--border);font-size:11.5px;color:var(--muted);line-height:1.6}
.side-foot b{color:var(--text);font-size:12.5px}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;
  padding:13px 22px;border-bottom:1px solid var(--border);
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);
}
#menuBtn{display:none}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:9px}
.icon-btn{
  width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--card);
  color:var(--text);cursor:pointer;font-size:15px;display:grid;place-items:center;position:relative;transition:.18s;
}
.icon-btn:hover{background:var(--card2);transform:translateY(-1px)}
.badge-dot{
  position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);
  color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg);
}
.user-chip{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 5px;border-radius:40px;background:var(--card);border:1px solid var(--border);cursor:pointer}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--primary),var(--purple))}
#pages{padding:22px;flex:1}
.page{display:none;animation:fade .28s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-head{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.page-head h1{font-size:24px;font-weight:800;letter-spacing:-.4px}
.page-head p{font-size:12.5px;margin-top:4px}
.muted{color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.card{
  background:linear-gradient(180deg,var(--card),var(--card2));
  border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);
}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}
.card-head h3{font-size:14px;font-weight:700;letter-spacing:.1px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;margin-bottom:16px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
input,select,textarea{
  background:var(--bg2);border:1px solid var(--border);color:var(--text);
  padding:9px 12px;border-radius:10px;font:500 13px 'Inter';outline:none;transition:.15s;width:100%;
}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.18)}
textarea{resize:vertical;min-height:70px}
label.fld{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.55px;margin-bottom:6px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 15px;border-radius:10px;border:1px solid var(--border);background:var(--card2);
  color:var(--text);font:700 12.5px 'Inter';cursor:pointer;transition:.18s;white-space:nowrap;
}
.btn:hover{transform:translateY(-1px);border-color:var(--primary)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--purple));border-color:transparent;color:#fff;box-shadow:0 8px 20px rgba(99,102,241,.35)}
.btn.ok{background:linear-gradient(135deg,#16a34a,#22c55e);border-color:transparent;color:#fff}
.btn.danger{background:linear-gradient(135deg,#dc2626,#ef4444);border-color:transparent;color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:11.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:14px;margin-bottom:18px}
.stat{
  position:relative;overflow:hidden;padding:16px;border-radius:16px;cursor:pointer;
  background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--border);transition:.2s;
}
.stat:hover{transform:translateY(-3px);border-color:var(--primary)}
.stat::after{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:var(--c,var(--primary))}
.stat .ico{font-size:19px;margin-bottom:9px}
.stat .num{font-size:27px;font-weight:800;letter-spacing:-1px;line-height:1}
.stat .lbl{font-size:11.5px;color:var(--muted);margin-top:6px;font-weight:600;letter-spacing:.2px}
.tbl-wrap{overflow:auto;border-radius:12px;border:1px solid var(--border);max-height:560px}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px}
thead th{
  position:sticky;top:0;z-index:2;background:var(--bg2);text-align:left;padding:11px 12px;
  font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:800;
  border-bottom:1px solid var(--border);white-space:nowrap;
}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr:hover{background:rgba(99,102,241,.09)}
tbody tr:last-child td{border-bottom:0}
.empty{padding:34px;text-align:center;color:var(--muted);font-size:13px}
.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:800;letter-spacing:.2px}
.tag.Hot{background:rgba(239,68,68,.17);color:#f87171}
.tag.Warm{background:rgba(245,158,11,.17);color:#fbbf24}
.tag.Cold{background:rgba(34,211,238,.17);color:#22d3ee}
.tag.Junk{background:rgba(120,120,140,.22);color:#a1a8c4}
.tag.Purchased{background:rgba(34,197,94,.17);color:#4ade80}
.tag.default{background:rgba(99,102,241,.17);color:#a5b4fc}
.bar-row{display:flex;align-items:center;gap:11px;margin-bottom:9px;font-size:12.5px}
.bar-row .name{flex:0 0 128px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bar-track{flex:1;height:8px;border-radius:8px;background:var(--bg2);overflow:hidden}
.bar-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--primary),var(--purple));transition:width .5s}
.bar-row .val{flex:0 0 62px;text-align:right;font-weight:800;font-size:12px}
.modal-back{position:fixed;inset:0;background:rgba(4,6,16,.72);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:200}
.modal{background:var(--card);border:1px solid var(--border);border-radius:20px;width:100%;max-width:720px;max-height:90vh;overflow:auto;box-shadow:0 30px 70px rgba(0,0,0,.6);animation:pop .22s ease}
.modal.wide{max-width:960px}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:3}
.modal-head h3{font-size:15px;font-weight:800}
.modal-body{padding:18px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}
.form-grid .full{grid-column:1/-1}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.prod-pick{border:2px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;position:relative;background:var(--bg2);transition:.18s}
.prod-pick:hover{transform:translateY(-2px)}
.prod-pick.sel{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.28)}
.prod-pick img{width:100%;height:105px;object-fit:cover;display:block}
.prod-pick .pi{padding:8px}
.prod-pick .pn{font-size:12px;font-weight:800;margin-bottom:2px}
.prod-pick .pp{font-size:11px;color:var(--accent);font-weight:700}
.prod-pick .chk{position:absolute;top:7px;right:7px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;font-size:12px;border:2px solid #fff}
.prod-pick.sel .chk{background:var(--primary)}
.drop{
  border:2px dashed var(--border);border-radius:16px;padding:34px 18px;text-align:center;cursor:pointer;transition:.2s;
  background:linear-gradient(180deg,transparent,rgba(99,102,241,.06));
}
.drop:hover{border-color:var(--primary);background:rgba(99,102,241,.09)}
.drop .big{font-size:36px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:20px;background:var(--card2);border:1px solid var(--border);font-size:12px;font-weight:600;margin:0 6px 8px 0}
.chip button{background:none;border:0;color:var(--danger);cursor:pointer;font-size:13px;line-height:1}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hr{height:1px;background:var(--border);margin:14px 0}
.switch{position:relative;display:inline-block;width:44px;height:24px;flex:0 0 44px}
.switch input{display:none}
.slider{position:absolute;inset:0;background:var(--border);border-radius:24px;cursor:pointer;transition:.2s}
.slider:before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + .slider{background:var(--primary)}
.switch input:checked + .slider:before{transform:translateX(20px)}
#loginScreen{
  position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;
  background:var(--bg);padding:20px;
}
.login-card{
  width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);
  border-radius:24px;padding:32px;box-shadow:0 30px 80px rgba(0,0,0,.6);text-align:center;
}
.login-card .logo{
  width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:32px;margin:0 auto 20px;
  background:linear-gradient(135deg,var(--primary),var(--purple));box-shadow:0 8px 22px rgba(99,102,241,.45);
}
.login-card h2{font-size:22px;font-weight:800;margin-bottom:6px}
.login-card p{font-size:13px;color:var(--muted);margin-bottom:24px}
.login-card .fld{text-align:left}
.demo-box{margin-top:20px;padding:12px;border-radius:10px;background:rgba(99,102,241,.1);font-size:11.5px;color:var(--primary);line-height:1.6;border:1px solid rgba(99,102,241,.2)}
#toast{position:fixed;bottom:22px;right:22px;z-index:600;display:flex;flex-direction:column;gap:9px}
.toast{
  padding:12px 17px;border-radius:12px;font-size:12.5px;font-weight:700;color:#fff;
  box-shadow:0 12px 30px rgba(0,0,0,.4);animation:slideIn .25s ease;max-width:330px;
}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.toast.ok{background:linear-gradient(135deg,#16a34a,#22c55e)}
.toast.err{background:linear-gradient(135deg,#dc2626,#ef4444)}
.toast.info{background:linear-gradient(135deg,#4f46e5,#8b5cf6)}
@media(max-width:980px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:.25s;box-shadow:0 0 60px rgba(0,0,0,.6)}
  .sidebar.open{transform:none}
  #menuBtn{display:grid}
  #pages{padding:15px}
  .topbar{padding:11px 14px}
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="logo">🛞</div>
    <h2>Welcome to Chourasiya Tyres Sales CRM</h2>
    <p>Please sign in to your account</p>
    <div style="margin-bottom:14px">
      <label class="fld">Email / User ID</label>
      <input id="loginId" placeholder="Enter your email" style="margin-bottom:4px">
    </div>
    <div style="margin-bottom:20px">
      <label class="fld">Password</label>
      <input id="loginPass" type="password" placeholder="Enter password">
    </div>
    <button class="btn primary" style="width:100%;padding:12px" onclick="doLogin()">Sign In →</button>
  </div>
</div>

<div class="app" id="mainApp">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">🛞</div>
      <div><h1>Chourasiya Tyres</h1><p>Sales</p></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <b id="sideUserName">User</b><br>
      <span id="sideUserRole">Role</span>
    </div>
  </aside>
  <main>
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div class="user-chip" onclick="confirmLogout()" title="Click to Logout">
        <div class="avatar" id="avatar">U</div>
        <div style="font-size:12px;font-weight:700;padding-right:5px" id="topUserName">User</div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Theme">🌙</button>
        <button class="icon-btn" onclick="openNotifications()" title="Notifications">🔔<span class="badge-dot" id="bellCount" style="display:none">0</span></button>
      </div>
    </header>
    <div id="pages">
      <section id="page-dashboard" class="page"></section>
      <section id="page-uploads" class="page"></section>
      <section id="page-reports" class="page"></section>
      <section id="page-leads" class="page"></section>
      <section id="page-products" class="page"></section>
      <section id="page-settings" class="page"></section>
    </div>
  </main>
</div>
<div id="modalRoot"></div>
<div id="toast"></div>

<script>
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p+'_'+Math.random().toString(36).slice(2,9);
const pad = n => String(n).padStart(2,'0');
const fmtDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => fmtDate(new Date());
const money = n => '₹'+Number(n||0).toLocaleString('en-IN');
function addDays(ds,n){ const d=new Date(ds+'T00:00:00'); d.setDate(d.getDate()+n); return fmtDate(d); }
function prettyDate(s){ if(!s) return '—'; const p=String(s).split('-'); return p.length===3?`${p[2]}-${p[1]}-${p[0]}`:s; }

// ⚠️ YAHAN APNA CLOUDFLARE WORKER URL DAALEIN
const API_URL = "https://chourasiyatyre.rishurafta.workers.dev";

const BASE_FIELDS=[
  {key:'leadSource',  label:'Lead Source',   type:'text'},
  {key:'entryDate',   label:'Entry Date',    type:'date'},
  {key:'mobile',      label:'Mobile Number', type:'text'},
  {key:'name',        label:'Name',          type:'text'},
  {key:'city',        label:'City',          type:'text'},
  {key:'state',       label:'State',         type:'text'},
  {key:'shopName',    label:'Shop Name',     type:'text'},
  {key:'orderAmount', label:'Order Amount',  type:'number'},
  {key:'orderQty',    label:'Order Qty',     type:'number'},
  {key:'tagging',     label:'Tagging',       type:'select'},
  {key:'followUpDate',label:'Follow Up Date',type:'date'},
  {key:'visitDate',   label:'Visit Date',    type:'date'},
  {key:'remarks',     label:'Remarks',       type:'textarea'}
];
const DEFAULT_TAGS=['Hot','Warm','Cold','Junk','Purchased','Follow Up','Visited','Quotation Sent'];
const DEFAULT_COLUMNS=JSON.parse(JSON.stringify(BASE_FIELDS));
const DEFAULT_PERMS={dashboard:1,leads:1,uploads:1,reports:1,products:1,settings:1};
const PAGES=['dashboard','leads','uploads','reports','products','settings'];
const PAGE_META={
  dashboard:{icon:'📊',label:'Dashboard'},
  leads:{icon:'👥',label:'Leads'},
  uploads:{icon:'📤',label:'Uploads'},
  reports:{icon:'📈',label:'Reports'},
  products:{icon:'🛞',label:'Products'},
  settings:{icon:'⚙️',label:'Settings'}
};

function ph(label,c1,c2){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
  <rect width="600" height="420" fill="url(#g)"/>
  <circle cx="300" cy="200" r="125" fill="#0d0f18" opacity=".92"/>
  <circle cx="300" cy="200" r="78" fill="#242a40"/>
  <circle cx="300" cy="200" r="34" fill="#7c8399"/>
  <circle cx="300" cy="200" r="14" fill="#c9cee0"/>
  <text x="300" y="382" font-family="Arial,Helvetica" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">${label}</text>
  </svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

// Fallback data for Users, Products, Staff (saved in LocalStorage)
const LS_KEY = 'tyro_crm_local_v1';

function loadLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return {
    settings:{ theme:'dark', notifications:true, whatsapp:'', telegram:'', currentUserId:null, sheetUrl:'', sheetName:'', autoSync:false, lastSync:'' },
    users:[
      {id:'u1',name:'Rahul Sharma',email:'rahuk@tyro.com',password:'1234',role:'Admin',perms:{...DEFAULT_PERMS}},
      {id:'u2',name:'Priya Verma',email:'priya@tyro.com',password:'1234',role:'Sales',perms:{dashboard:1,leads:1,uploads:1,reports:1,products:1,settings:0}},
      {id:'u3',name:'Amit Singh',email:'amit@tyro.com',password:'1234',role:'Sales',perms:{dashboard:1,leads:1,uploads:0,reports:1,products:1,settings:0}},
      {id:'u4',name:'Neha Gupta',email:'neha@tyro.com',password:'1234',role:'Sales',perms:{dashboard:1,leads:1,uploads:0,reports:1,products:1,settings:0}}
    ],
    tags:DEFAULT_TAGS.slice(),
    columns:JSON.parse(JSON.stringify(DEFAULT_COLUMNS)),

function saveLocal() {
  const localDB = {
    settings: DB.settings,
    users: DB.users,
    tags: DB.tags,
    columns: DB.columns,
    products: DB.products,
    staff: DB.staff
  };
  localStorage.setItem(LS_KEY, JSON.stringify(localDB));
}

let DB = loadLocal();
DB.leads = []; // Will be populated from Cloudflare

let UI = {
  page:'dashboard',
  dashPeriod:'monthly', dashFrom:'', dashTo:'', dashUser:'all',
  reportPeriod:'monthly', reportFrom:'', reportTo:'', reportUser:'all', reportTag:'all',

function toast(msg,type='info'){
  const el=document.createElement('div');
  el.className='toast '+type;
  el.textContent=msg;
  $('#toast').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(40px)'; el.style.transition='.3s'; setTimeout(()=>el.remove(),320); },3200);
}
function openModal(html,{title='',wide=false}={}){
  $('#modalRoot').innerHTML=`
    <div class="modal-back" onclick="if(event.target===this)closeModal()">
      <div class="modal ${wide?'wide':''}">
        <div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
        <div class="modal-body">${html}</div>
      </div>
    </div>`;
}
function closeModal(){ $('#modalRoot').innerHTML=''; }
function currentUser(){ return DB.users.find(u=>u.id===DB.settings.currentUserId) || DB.users[0]; }
function userName(id){ const u=DB.users.find(x=>x.id===id); return u?u.name:'—'; }
function can(p){
  const u=currentUser();
  if(!u) return false;
  if(u.role==='Admin') return true;
  return !!(u.perms && u.perms[p]);
}
function applyTheme(){
  document.documentElement.dataset.theme = DB?.settings?.theme || 'dark';
  const b=$('#themeBtn'); if(b) b.textContent = (DB?.settings?.theme==='dark')?'🌙':'☀️';
}
function toggleTheme(){
  DB.settings.theme = (DB.settings.theme==='dark')?'light':'dark';
  applyTheme(); saveLocal(); toast('Theme changed to '+DB.settings.theme,'ok');
}

function ensurePerms(){
  let dirty=false;
  DB.users.forEach(u=>{
    if(!u.perms || typeof u.perms!=='object'){ u.perms={...DEFAULT_PERMS}; dirty=true; }
    PAGES.forEach(p=>{
      if(u.perms[p]===undefined){ u.perms[p] = u.role==='Admin' ? 1 : (p==='settings'?0:1); dirty=true; }
    });
    if(u.role==='Admin'){ PAGES.forEach(p=>{ if(!u.perms[p]){ u.perms[p]=1; dirty=true; } }); }
  });
  if(dirty) saveLocal();
}

async function fetchLeads() {
  try {
    const res = await fetch(`${API_URL}/api/leads`);
    if(res.ok) DB.leads = await res.json();
  } catch(e) { console.error('Failed to load leads', e); }
}

async function boot() {
  await fetchLeads();
  ensurePerms();
  applyTheme();
  
  if (DB.settings.currentUserId && DB.users.some(u=>u.id===DB.settings.currentUserId)) {
    $('#loginScreen').style.display = 'none';
    $('#mainApp').classList.add('show');
    renderNav(); updateTopbar(); go('dashboard');
  } else {
    $('#loginScreen').style.display = 'flex';
    $('#mainApp').classList.remove('show');
  }
}

function doLogin(){
  const id = $('#loginId').value.trim().toLowerCase();
  const pass = $('#loginPass').value;
  const user = DB.users.find(u => (u.email.toLowerCase() === id || u.name.toLowerCase() === id) && u.password === pass);
  
  if(!user){ toast('Invalid Email/User ID or Password','err'); return; }
  
  DB.settings.currentUserId = user.id;
  saveLocal();
  
  $('#loginScreen').style.display = 'none';
  $('#mainApp').classList.add('show');
  
  UI.page = 'dashboard';
  UI.leadUser = 'all';
  applyTheme(); renderNav(); updateTopbar(); go('dashboard');
  toast('Welcome back, ' + user.name.split(' ')[0] + '!','ok');
}

function confirmLogout(){
  if(!confirm('Are you sure you want to log out?')) return;
  DB.settings.currentUserId = null;
  saveLocal();
  $('#mainApp').classList.remove('show');
  $('#loginScreen').style.display = 'flex';
  $('#loginPass').value = '';
}

function periodRange(period,from,to){
  const t=new Date(); const td=fmtDate(t);
  if(period==='yesterday'){ const y=addDays(td,-1); return {from:y,to:y}; }
  if(period==='weekly')   { return {from:addDays(td,-6),to:td}; }
  if(period==='monthly')  { return {from:fmtDate(new Date(t.getFullYear(),t.getMonth(),1)),to:td}; }
  if(period==='custom')   { return {from:from||'0000-01-01', to:to||'9999-12-31'}; }
  return {from:'0000-01-01',to:'9999-12-31'};
}

function filterLeads({from,to,user}={}){
  return DB.leads.filter(l=>{
    const ed=l.entryDate||today();
    if(from && ed<from) return false;
    if(to && ed>to) return false;
    if(user && user!=='all' && l.assignedTo!==user) return false;
    return true;
  });
}
const isClosed = l => l.tagging==='Junk' || l.tagging==='Purchased';

const RENDER = {};
function renderNav(){
  $('#nav').innerHTML = PAGES.map(p=>{
    const m=PAGE_META[p];
    return `<button class="nav-item ${UI.page===p?'active':''}" onclick="go('${p}')">
      <span class="nav-ico">${m.icon}</span><span>${m.label}</span></button>`;
  }).join('');
}
function go(page){
  UI.page=page;
  renderNav();
  $$('.page').forEach(e=>e.classList.remove('active'));
  const el=$('#page-'+page);
  if(el){ el.classList.add('active'); RENDER[page] && RENDER[page](); }
  $('#sidebar').classList.remove('open');
  window.scrollTo({top:0,behavior:'smooth'});
}
function updateTopbar(){
  const u=currentUser();
  if(!u) return;
  $('#avatar').textContent=(u.name||'U').charAt(0).toUpperCase();
  $('#topUserName').textContent=u.name;
  $('#sideUserName').textContent=u.name;
  $('#sideUserRole').textContent=u.role;
  const t=today();
  const myLeads = DB.leads;
  const n=myLeads.filter(l=>!isClosed(l) && ((l.followUpDate && l.followUpDate<=t)||l.visitDate===t)).length;
  const b=$('#bellCount');
  b.textContent=n; b.style.display=n?'grid':'none';
}
function refresh(silent){
  renderNav(); updateTopbar();
  if(RENDER[UI.page]) RENDER[UI.page]();
}
